<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Payment Tracker</title>
<style>
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a}
.wrap{max-width:950px;margin:30px auto;padding:0 15px}
header{background:#0f172a;color:white;padding:28px;border-radius:20px}
header small{color:#93c5fd;font-weight:bold}
h1{font-size:42px;margin:8px 0}
.info{color:#cbd5e1}.alert{margin-top:18px;padding:12px;border-radius:10px;background:#064e3b}
.alert.bad{background:#991b1b}.card{background:white;margin-top:20px;padding:24px;border-radius:20px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:end}
select,button{padding:10px;border-radius:8px;border:1px solid #cbd5e1;font-weight:bold}
button{background:#1e3a8a;color:white;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:13px;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f8fafc;color:#64748b;font-size:12px}
td:last-child,th:last-child{text-align:center}
.paid{background:#dcfce7;color:#047857;padding:7px;border-radius:7px}
.overdue{background:#fee2e2;color:#b91c1c;padding:7px;border-radius:7px}
.pending{background:#f1f5f9;color:#475569;padding:7px;border-radius:7px}
.note{color:#64748b;font-size:12px;margin-top:15px}
@media(max-width:650px){.top{display:block}select{width:100%;margin-top:12px}h1{font-size:34px}}
</style>
</head>

<body>
<div class="wrap">

<header>
<small>LOAN PAYMENT TRACKER</small>
<div class="info">Outstanding balance</div>
<h1 id="balance">€10,000.00</h1>
<div class="info">Original principal €10,000.00 · Monthly payment €176.00</div>

<div id="alert" class="alert">
<strong id="alertTitle">Payments up to date</strong><br>
<span id="alertText">No overdue instalments</span>
</div>
</header>

<div class="card">

<div class="top">
<div>
<h2 id="yearTitle">Loan year 1</h2>
<div id="period" class="info"></div>
</div>

<div>
<select id="year">
<option value="1">Year 1</option>
<option value="2">Year 2</option>
<option value="3">Year 3</option>
<option value="4">Year 4</option>
<option value="5">Year 5</option>
<option value="6">Year 6</option>
</select>

<button id="admin">Admin preview</button>
</div>
</div>

<table>
<thead>
<tr>
<th>Month</th>
<th>Starting balance</th>
<th>Remaining balance</th>
<th>Status</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<div class="note">
Payments are due on the 27th of each month. First payment: 27 October 2026.
</div>

</div>
</div>

<script>
const P=10000,R=.083/12,PAY=176;
let admin=false;
let paid=JSON.parse(localStorage.getItem("loan-paid-months")||"{}");

const euro=n=>"€"+n.toLocaleString("en-IE",{minimumFractionDigits:2,maximumFractionDigits:2});

let schedule=[],bal=P;

for(let i=0;i<72;i++){
 let start=bal;
 let interest=start*R;
 let principal=PAY-interest;
 bal=start-principal;

 schedule.push({
  n:i+1,
  year:Math.floor(i/12)+1,
  date:new Date(2026,9+i,27),
  start:start,
  principal:principal,
  remaining:bal
 });
}

function overdue(x){
 let now=new Date();
 now.setHours(23,59,59,999);
 return x.date<now&&!paid[x.n];
}

function render(){

 let year=Number(document.getElementById("year").value);
 let list=schedule.filter(x=>x.year===year);

 let principalPaid=schedule.reduce((s,x)=>
   s+(paid[x.n]?x.principal:0),0);

 document.getElementById("balance").textContent=
   euro(Math.max(0,P-principalPaid));

 let late=schedule.filter(overdue);
 let alert=document.getElementById("alert");

 if(late.length){
   alert.className="alert bad";
   document.getElementById("alertTitle").textContent="Overdue payment";
   document.getElementById("alertText").textContent=
     late.length+" payment"+(late.length===1?" is":"s are")+" overdue";
 }else{
   alert.className="alert";
   document.getElementById("alertTitle").textContent="Payments up to date";
   document.getElementById("alertText").textContent="No overdue instalments";
 }

 document.getElementById("yearTitle").textContent="Loan year "+year;

 document.getElementById("period").textContent=
   list[0].date.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+
   " to "+
   list[11].date.toLocaleDateString("en-GB",{month:"long",year:"numeric"});

 let html="";

 list.forEach(x=>{

   let isPaid=!!paid[x.n];
   let late=overdue(x);

   let status;

   if(admin){
     status=
       '<label class="'+(late?"overdue":isPaid?"paid":"pending")+'">'+
       '<input type="checkbox" data-n="'+x.n+'" '+(isPaid?"checked":"")+'> €176.00</label>';
   }else{
     status=
       '<span class="'+(late?"overdue":isPaid?"paid":"pending")+'">'+
       (isPaid?"✓ Paid":late?"€176.00 · Overdue":"Not yet due")+
       '</span>';
   }

   html+=
   "<tr>"+
   "<td><strong>"+
   x.date.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+
   "</strong><br><small>Due 27th</small></td>"+
   "<td>"+euro(x.start)+"</td>"+
   "<td><strong>"+euro(x.remaining)+"</strong></td>"+
   "<td>"+status+"</td>"+
   "</tr>";
 });

 document.getElementById("rows").innerHTML=html;

 document.querySelectorAll("input[data-n]").forEach(box=>{
   box.onchange=()=>{
     paid[box.dataset.n]=box.checked;
     localStorage.setItem("loan-paid-months",JSON.stringify(paid));
     render();
   };
 });
}

document.getElementById("year").onchange=render;

document.getElementById("admin").onclick=()=>{
 admin=!admin;
 document.getElementById("admin").textContent=
   admin?"Viewer mode":"Admin preview";
 render();
};

render();
