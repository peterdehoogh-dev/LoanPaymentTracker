<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loan Payment Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: 32px auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      padding: 32px;
      color: white;
      background: linear-gradient(135deg, #020617, #172554);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
    }

    .app-name {
      margin-bottom: 18px;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .balance-label {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .balance {
      margin: 6px 0 12px;
      font-size: 46px;
      line-height: 1;
    }

    .loan-details {
      margin: 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .header-right {
      width: 290px;
    }

    .payment-alert {
      padding: 17px;
      border: 1px solid rgba(52, 211, 153, 0.4);
      background: rgba(16, 185, 129, 0.15);
      border-radius: 16px;
    }

    .payment-alert.overdue {
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(239, 68, 68, 0.18);
    }

    .alert-title {
      margin: 0 0 5px;
      font-weight: 700;
    }

    .alert-text {
      margin: 0;
      color: #e2e8f0;
      font-size: 14px;
    }

    .admin-button {
      width: 100%;
      margin-top: 12px;
      padding: 11px 16px;
      color: white;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      cursor: pointer;
    }

    .admin-button:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .card {
      margin-top: 24px;
      padding: 28px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, 0.06);
    }

    .schedule-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .section-label {
      margin: 0 0 8px;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .period {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .mode-label {
      margin: 9px 0 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
    }
